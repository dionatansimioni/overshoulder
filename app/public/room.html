<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overshoulder · Sala</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/room.js"></script>
</head>
<body>
  <!-- Ícones usados pelos botões (<use href="#i-…">) -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M15 9.3V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 4.9 2.3M5.5 11a6.5 6.5 0 0 0 10.7 5M18.4 12.5a6.5 6.5 0 0 0 .1-1.5M12 17.5V21M3 3l18 18"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-screen-off" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M9 7.5l6 5M15 7.5l-6 5"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  </svg>

  <!-- Tela de entrada: o clique em "Entrar" também libera o autoplay de áudio -->
  <main id="join" class="home">
    <div class="card">
      <h1 class="brand"><img src="/static/icon.svg" alt="" width="36" height="36">Overshoulder</h1>
      <form id="join-form" class="form">
        <label for="name">Seu nome</label>
        <input id="name" maxlength="32" autocomplete="nickname" required>
        <p id="sso-hint" class="muted small" hidden></p>
        <button type="submit">Entrar na sala</button>
        <p id="join-error" class="error" hidden></p>
        <button id="sso-join" type="button" class="secondary" hidden>Entrar com login da empresa</button>
      </form>
      <p class="muted small lang-row"><span data-lang-switch></span></p>
    </div>
  </main>

  <div id="room" class="room" hidden>
    <section class="stage">
      <header class="topbar">
        <span class="brand small-brand"><img src="/static/icon.svg" alt="" width="24" height="24">Overshoulder</span>
        <div id="invite" class="invite" hidden>
          <svg class="icon"><use href="#i-link"/></svg>
          <input id="invite-link" readonly aria-label="Link para os amigos">
          <button id="copy" type="button" class="secondary">Copiar convite</button>
          <button id="new-link" type="button" class="secondary" title="Gera um link novo; o atual deixa de funcionar para quem ainda não entrou">Novo link</button>
        </div>
      </header>

      <div id="player" class="player">
        <video id="video" playsinline autoplay muted></video>
        <div id="overlay" class="overlay">Aguardando a transmissão começar…</div>
        <div id="mic-badge" class="badge" hidden>
          <svg class="icon"><use href="#i-mic"/></svg>
          Microfone ligado
        </div>
        <div id="presenter-badge" class="badge presenter" hidden></div>
        <div id="rec-badge" class="badge rec" hidden>● Gravando</div>
      </div>

      <div class="dock">
        <div id="viewer-controls" class="controls" hidden>
          <label class="volume" title="Volume">
            <svg class="icon"><use href="#i-volume"/></svg>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          </label>
          <button id="fullscreen" type="button" class="round" title="Tela cheia" aria-label="Tela cheia">
            <svg class="icon"><use href="#i-fullscreen"/></svg>
          </button>
          <span id="stats" class="muted small"></span>
        </div>

        <div id="host-controls" class="controls" hidden>
          <button id="mic" type="button" class="round" title="Ligar microfone" aria-label="Ligar microfone" aria-pressed="false">
            <svg class="icon"><use href="#i-mic-off"/></svg>
          </button>
          <button id="share" type="button" class="round" title="Compartilhar tela" aria-label="Compartilhar tela">
            <svg class="icon"><use href="#i-screen"/></svg>
          </button>
          <button id="record" type="button" class="round" title="Gravar a transmissão" aria-label="Gravar a transmissão" aria-pressed="false">
            <svg class="icon"><use href="#i-record"/></svg>
          </button>
          <button id="settings-btn" type="button" class="round" title="Ajustes da transmissão" aria-label="Ajustes da transmissão" aria-expanded="false">
            <svg class="icon"><use href="#i-settings"/></svg>
          </button>
          <button id="end" type="button" class="round danger" title="Encerrar sala" aria-label="Encerrar sala">
            <svg class="icon"><use href="#i-power"/></svg>
          </button>

          <div id="settings" class="popover" hidden>
            <h2>Ajustes da transmissão</h2>
            <label for="quality">Qualidade</label>
            <select id="quality">
              <option value="720p30">720p · 30 fps</option>
              <option value="720p60">720p · 60 fps</option>
              <option value="1080p30">1080p · 30 fps</option>
              <option value="1080p60" selected>1080p · 60 fps</option>
              <option value="1440p60">1440p · 60 fps</option>
            </select>
            <label for="codec">Codec</label>
            <select id="codec">
              <option value="h264" selected>H.264 (mais leve)</option>
              <option value="vp9">VP9</option>
              <option value="av1">AV1</option>
            </select>
            <label for="mic-device">Microfone</label>
            <select id="mic-device">
              <option value="">Padrão do sistema</option>
            </select>
            <label for="audio-device">Áudio do jogo</label>
            <div class="row">
              <select id="audio-device">
                <option value="">Só o da captura</option>
              </select>
              <button id="load-devices" type="button" class="secondary">Listar</button>
            </div>
            <p class="muted small">Clique em “Listar” para ver os microfones e dispositivos de áudio. No Linux, o navegador só captura áudio de abas: para o áudio do jogo, escolha o “Monitor of …” da sua saída de som.</p>
          </div>
        </div>
      </div>
    </section>

    <aside class="chat">
      <header class="chat-header">
        <div class="tabs" role="tablist">
          <button id="tab-chat" type="button" class="tab" role="tab" aria-selected="true">Chat</button>
          <button id="tab-people" type="button" class="tab" role="tab" aria-selected="false">Pessoas</button>
        </div>
        <span id="count" class="muted small"></span>
      </header>
      <div id="chat-tools" class="chat-tools" hidden>
        <button id="chat-toggle" type="button" class="secondary">Desligar chat</button>
      </div>
      <ul id="people" class="people" hidden></ul>
      <ul id="messages"></ul>
      <form id="chat-form">
        <div id="emoji-picker" class="emoji-picker" hidden>
          <div class="emoji-tabs" role="tablist" aria-label="Categorias de emoji"></div>
          <p class="emoji-title"></p>
          <div class="emoji-grid"></div>
        </div>
        <div class="composer">
          <input id="chat-input" maxlength="500" placeholder="Conversar na sala" autocomplete="off">
          <button id="emoji-btn" type="button" class="emoji-btn" title="Emojis" aria-label="Emojis" aria-expanded="false">😊</button>
        </div>
      </form>
    </aside>
  </div>

  <div id="audio-sink" hidden></div>
</body>
</html>
