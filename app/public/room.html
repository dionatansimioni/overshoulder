<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overshoulder · Sala</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/room.js"></script>
</head>
<body>
  <!-- Tela de entrada: o clique em "Entrar" também libera o autoplay de áudio -->
  <main id="join" class="home">
    <h1 class="brand"><img src="/static/icon.svg" alt="" width="36" height="36">Overshoulder</h1>
    <form id="join-form" class="card">
      <label for="name">Seu nome</label>
      <input id="name" maxlength="32" autocomplete="nickname" required>
      <button type="submit">Entrar</button>
      <p id="join-error" class="error" hidden></p>
    </form>
  </main>

  <div id="room" class="room" hidden>
    <section class="stage">
      <div id="player" class="player">
        <video id="video" playsinline autoplay muted></video>
        <div id="overlay" class="overlay">Aguardando a transmissão começar…</div>
      </div>

      <div class="bar">
        <div id="viewer-controls" class="controls" hidden>
          <label class="inline">🔊 <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
          <button id="fullscreen" type="button" class="secondary">Tela cheia</button>
          <span id="stats" class="muted small"></span>
        </div>

        <div id="host-controls" class="controls" hidden>
          <select id="quality" aria-label="Qualidade">
            <option value="720p30">720p · 30 fps</option>
            <option value="720p60">720p · 60 fps</option>
            <option value="1080p30">1080p · 30 fps</option>
            <option value="1080p60" selected>1080p · 60 fps</option>
            <option value="1440p60">1440p · 60 fps</option>
          </select>
          <select id="codec" aria-label="Codec">
            <option value="h264" selected>H.264 (mais leve)</option>
            <option value="vp9">VP9</option>
            <option value="av1">AV1</option>
          </select>
          <select id="audio-device" aria-label="Áudio extra">
            <option value="">Áudio: só o da captura</option>
          </select>
          <button id="load-devices" type="button" class="secondary" title="Listar dispositivos de áudio (ex.: Monitor do PipeWire)">🎚️</button>
          <button id="share" type="button">Compartilhar tela</button>
          <button id="end" type="button" class="danger">Encerrar sala</button>
        </div>

        <span id="count" class="muted small"></span>
      </div>

      <div id="invite" class="card invite" hidden>
        <span class="small">Link para os amigos:</span>
        <input id="invite-link" readonly>
        <button id="copy" type="button" class="secondary">Copiar</button>
        <p class="muted small">No Linux, o Chrome só captura áudio de abas. Para o áudio do jogo, use 🎚️ e escolha o “Monitor” da sua saída de som.</p>
      </div>
    </section>

    <aside class="chat">
      <ul id="messages"></ul>
      <form id="chat-form">
        <input id="chat-input" maxlength="500" placeholder="Mensagem…" autocomplete="off">
      </form>
    </aside>
  </div>

  <div id="audio-sink" hidden></div>
</body>
</html>
