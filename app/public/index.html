<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overshoulder</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/home.js"></script>
</head>
<body>
  <main class="home">
    <div class="card">
      <h1 class="brand"><img src="/static/icon.svg" alt="" width="36" height="36">Overshoulder</h1>
      <p class="muted">Compartilhe a tela com seu público, direto no navegador e com criptografia de ponta a ponta.</p>

      <form id="login-form" class="form" hidden>
        <label for="username">Usuário</label>
        <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>

      <section id="signed-in" class="form" hidden>
        <p class="muted">Conectado como <b id="me"></b>.</p>
        <form id="create-form" class="form">
          <button type="submit">Criar sala</button>
          <p id="create-error" class="error" hidden></p>
        </form>
        <button id="logout" type="button" class="secondary">Sair</button>
      </section>
    </div>

    <p class="muted small hint">Recebeu um link de alguém? É só abrir o link, não precisa de conta.</p>
  </main>
</body>
</html>
