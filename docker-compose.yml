# Exemplo com Docker Compose. O equivalente com docker run está no README.
# Configuração no .env (gerado pelo ./setup.sh).
services:
  overshoulder:
    build: .
    image: overshoulder:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      DOMAIN: ${DOMAIN}
      TLS: ${TLS:-acme}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NODE_IP: ${NODE_IP:-}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-16}
    volumes:
      - data:/data

volumes:
  data:
